id = "asahiart.worktrunk"
name = "Worktrunk Worktrees"
version = "0.2.0"
min_luvus_version = "0.14.3"
description = "Create and remove Luvus worktrees through Worktrunk."
platforms = ["macos", "linux"]

[worktree_provider]
command = ["python3", "provider.py", "create"]
remove_command = ["python3", "provider.py", "remove"]

[[settings]]
key = "hook_policy"
title = "Worktrunk hook policy"
type = "enum"
default = "prompt"
options = ["prompt", "approve", "skip"]

[[settings]]
key = "remove_branch_policy"
title = "Branch after worktree removal"
type = "enum"
default = "keep"
options = ["keep", "delete_if_merged", "force_delete"]
